# OCR App — Linux CPU (Tesseract) for owui01
# Network: alterai_default (shared with local-ai-translator)
#
#   docker compose up -d --build
# From translator: http://ocr-backend:8000/api/ocr

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.cpu
    image: ocr-app-backend:cpu
    container_name: ocr-backend
    ports:
      - "${OCR_HOST_PORT:-8100}:8000"
    environment:
      OCR_LANG: ${OCR_LANG:-en}
      OCR_DEFAULT_ENGINE: ${OCR_DEFAULT_ENGINE:-tesseract}
      OCR_ENABLED_ENGINES: ${OCR_ENABLED_ENGINES:-tesseract}
      PDF_RENDER_DPI: ${PDF_RENDER_DPI:-200}
    networks:
      - alterai_default
    restart: unless-stopped

  frontend:
    profiles: ["ui"]
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    image: ocr-app-frontend:latest
    container_name: ocr-frontend
    ports:
      - "${OCR_FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - alterai_default
    restart: unless-stopped

networks:
  alterai_default:
    external: true
    name: alterai_default
